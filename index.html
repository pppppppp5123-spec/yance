<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="硯冊">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>硯冊</title>
<style>
:root{--ink:#2b2622;--paper:#f6f1e7;--seal:#a8322b;--line:#d8cfbf}
@media (prefers-color-scheme: dark){:root{--ink:#e9e2d6;--paper:#1f1c19;--line:#4a443c}}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:17px/1.6 "Noto Sans TC","PingFang TC",system-ui,sans-serif}
.box{max-width:340px;margin:0 auto;padding:18vh 24px 24px;text-align:center}
.mark{display:inline-flex;width:64px;height:64px;border-radius:14px;background:var(--seal);color:#fff;font-size:38px;align-items:center;justify-content:center;font-weight:700}
h1{font-size:22px;margin:14px 0 22px;letter-spacing:.1em}
input[type=password]{width:100%;box-sizing:border-box;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink)}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;font-size:15px}
button{width:100%;font-size:18px;padding:12px;border:0;border-radius:10px;background:var(--seal);color:#fff}
button:disabled{opacity:.6}
.msg{min-height:1.6em;margin-top:12px;color:var(--seal);font-size:15px}
</style>
</head>
<body>
<div class="box" id="box" hidden>
  <div class="mark">硯</div>
  <h1>硯冊</h1>
  <form id="f" autocomplete="off">
    <input type="password" id="pw" placeholder="密碼" autocomplete="current-password" autofocus>
    <label><input type="checkbox" id="rem" checked> 在這台裝置記住（下次不用再輸入）</label>
    <button id="go">開啟</button>
    <div class="msg" id="msg"></div>
  </form>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
/* 記住的鑰匙放在 IndexedDB（不能匯出的 CryptoKey，不存密碼本身） */
const idb = () => new Promise((ok, no) => { const r = indexedDB.open("yance_lock", 1); r.onupgradeneeded = () => r.result.createObjectStore("k"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const kget = async () => { try { const d = await idb(); return await new Promise(ok => { const q = d.transaction("k").objectStore("k").get("aes"); q.onsuccess = () => ok(q.result || null); q.onerror = () => ok(null); }); } catch (e) { return null; } };
const kput = async k => { try { const d = await idb(); await new Promise(ok => { const t = d.transaction("k", "readwrite"); t.objectStore("k").put(k, "aes"); t.oncomplete = ok; t.onerror = ok; }); } catch (e) { } };
const kdel = async () => { try { const d = await idb(); d.transaction("k", "readwrite").objectStore("k").delete("aes"); } catch (e) { } };
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(LOCK.salt), iterations: LOCK.iter }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
}
async function unlock(key) {
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(LOCK.iv) }, key, b64(LOCK.data));
  return new TextDecoder().decode(plain);
}
function show(html) {
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }   /* 請 iPad 不要清掉這裡的資料 */
  /* 整頁換成 App（含它的 <head>、內嵌 <script> 照順序跑完 boot()）——要用 document.write，createElement 做不到。
     寫進去的只有用自己的鑰匙解開的 App：AES-GCM 會驗證內容，被改過一個字就解不開，所以不會被塞進別人的東西 */
  document.open(); document.write(html); document.close();
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => { });   /* 離線也能開 */
(async () => {
  const box = document.getElementById("box"), msg = document.getElementById("msg"), go = document.getElementById("go");
  if (!window.crypto || !crypto.subtle) { box.hidden = false; msg.textContent = "這個瀏覽器不支援解密，請用 Safari 打開 https 網址。"; go.disabled = true; return; }
  const saved = await kget();
  if (saved) { try { show(await unlock(saved)); return; } catch (e) { await kdel(); } }   /* 改過密碼：記住的鑰匙打不開，重新輸入 */
  box.hidden = false;
  document.getElementById("f").onsubmit = async e => {
    e.preventDefault();
    const pw = document.getElementById("pw").value;
    if (!pw) return;
    go.disabled = true; msg.textContent = "解開中⋯";
    try {
      const key = await derive(pw);
      const html = await unlock(key);
      if (document.getElementById("rem").checked) await kput(key);
      show(html);
    } catch (err) { msg.textContent = "密碼不對"; go.disabled = false; }
  };
})();
</script>
